name: MobileCommand
options:
  bundleIdPrefix: com.ramisuvanto
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: JAN6H25J7X
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  MobileCommand:
    type: application
    platform: iOS
    sources:
      - MobileCommand
      - path: ../shared
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ramisuvanto.mobilecommand
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: MobileCommand/Info.plist
      properties:
        CFBundleDisplayName: MobileCommand
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: MobileCommand sends your voice to your Mac as its microphone.
        NSLocalNetworkUsageDescription: MobileCommand connects to your Mac on the local network.
        NSBonjourServices: [_mobilecommand._tcp]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
